[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "RAG 공격 및 정보 유출 진단 시스템"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "팀 수박", email = "21011742@sejong.ac.kr"},
]

dependencies = [
  "haystack-ai>=2.9.0,<3.0.0",     # 3.0 은 v2 API 와 비호환이라 상한을 박아 둔다
  "faiss-cpu>=1.9.0",
  "sentence-transformers>=3.0.0",  # BGE-m3-ko 임베딩 로드용
  "transformers>=4.50.0",          # KPF-BERT NER 로드용
  "torch>=2.5.0",
  "openai>=1.10.0",                # 2.x 메이저 변경 검토 후 업데이트 예정
  "typer>=0.12.0",
  "rich>=13.7.0",
  "rouge-score>=0.1.2",
  "pypdf>=4.0.0",
  "docling-haystack>=0.1.2",       # PDF 레이아웃·도표 보존 파서
  "reportlab>=4.1.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.1.0",
  "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
rag = "rag.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py311"
exclude = ["src/rag/report/dashboard_template.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
