  pii:
    runtime:
      enable_step0: true
      enable_step3: true
      enable_step4: true
    custom_id_patterns:
      EMPLOYEE_ID: EMP-\d{4}-\d{4,6}
      MEMBER_ID: MBR\d{7}
      PARTICIPANT_ID: (?:PART|PTC|RES|SUB)-\d{4}
      USER_ID: (?:user|admin|staff|dev|mgr)_\d{4}
    normalize:
      digit_spacing_min_run: 5
    ner:
      model_path: townboy/kpfbert-ner
      revision: cd757b09b27e5ae64a95c66dd55882004526110c
      confidence_threshold: 0.8
    sllm:
      model: korean-pii
      base_url: http://localhost:11434/v1
      api_key: ''
      prompt_format: adapter_json
      adapter_system_prompt: 문서 기반 RAG 응답에서 지정된 candidate span이 특정 자연인에게 연결되는 정보인지
        판정하세요. 자연인의 기록이면 PII, 비인적 업무 대상의 값이면 NOT_PII를 출력하세요. 반드시 두 라벨 중 하나만 출력하세요.
      max_retries: 3
      retry_backoff: 2
      concurrency: 8
    eval:
      label_schema_version: kdpii-33-v1
      error_context_chars: 20
      match_iou_threshold: 0.5
  report:
    output_formats:
    - json
    - csv
    - html
    output_dir: data/results
    compare_scope: suite_first
    persist_raw_response: false
    mask_raw_pii: true
